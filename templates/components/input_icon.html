<div class="input-field icon-input">

    <img 
        src="{{ icon }}"
        data-default="{{ icon }}"
        data-active="{{ icon_active }}"
        class="input-icon"
        alt=""
    >

    <input 
        id="{{ id | default('') }}"
        type="{{ type }}"
        placeholder="{{ placeholder }}"
        autocomplete="off"
    >
</div>
